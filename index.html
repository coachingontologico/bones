<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bones · INDICADORES</title>
<style>
  :root{
    --verde-oscuro:#0f3d2e;
    --verde-medio:#155c42;
    --verde-claro:#2e8b57;
    --hueso:#f4efe6;
    --hueso-suave:#e9e2d3;
    --dorado:#c9a45c;
    --texto:#1b2b23;
    --texto-suave:#5c6b63;
    --rojo:#c0503f;
    --sombra:0 10px 30px rgba(15,61,46,0.15);
    --radio:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,var(--hueso) 0%, var(--hueso-suave) 100%);
    color:var(--texto);
    padding-bottom:60px;
  }
  header{
    background:radial-gradient(circle at top left, var(--verde-medio), var(--verde-oscuro) 70%);
    color:var(--hueso);
    padding:32px 20px 40px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    bottom:-40px; left:50%;
    width:140%;
    height:80px;
    background:var(--hueso);
    border-radius:50%;
    transform:translateX(-50%);
  }
  .logo{
    width:64px; height:64px;
    border-radius:50%;
    background:var(--hueso);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 10px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    font-size:30px;
  }
  header h1{
    margin:0;
    font-size:22px;
    letter-spacing:2px;
    font-weight:700;
  }
  header p.sub{
    margin:6px 0 0;
    font-size:13px;
    opacity:0.85;
  }

  main{
    max-width:640px;
    margin:0 auto;
    padding:0 18px;
    position:relative;
    z-index:2;
  }

  .card{
    background:#fff;
    border-radius:var(--radio);
    box-shadow:var(--sombra);
    padding:22px 20px;
    margin-bottom:20px;
  }

  /* Progreso */
  .progreso-card{
    text-align:center;
  }
  .progreso-titulo{
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--texto-suave);
    font-weight:700;
    margin-bottom:4px;
  }
  .progreso-contador{
    font-size:14px;
    color:var(--verde-oscuro);
    font-weight:700;
    margin-bottom:14px;
  }
  .estaciones{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:8px;
  }
  .estacion{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    flex:1;
  }
  .punto{
    width:26px;height:26px;
    border-radius:50%;
    background:var(--hueso-suave);
    border:2px solid #ddd3bd;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    transition:all .2s;
  }
  .punto.si{
    background:var(--verde-claro);
    border-color:var(--verde-claro);
    color:#fff;
  }
  .punto.no{
    background:var(--rojo);
    border-color:var(--rojo);
    color:#fff;
  }
  .estacion-nombre{
    font-size:9px;
    color:var(--texto-suave);
    text-transform:uppercase;
    letter-spacing:0.5px;
    text-align:center;
  }
  .estacion-hora{
    font-size:8px;
    color:var(--dorado);
    font-weight:700;
  }
  .linea-conexion{
    flex:0.35;
    height:2px;
    background:var(--hueso-suave);
    margin-top:11px;
  }

  /* Pregunta guiada */
  .pregunta-card{
    border-left:5px solid var(--verde-claro);
  }
  .pregunta-emoji{
    font-size:28px;
    margin-bottom:8px;
  }
  .pregunta-texto{
    font-size:17px;
    font-weight:700;
    color:var(--verde-oscuro);
    margin:0 0 8px;
  }
  .pregunta-desc{
    font-size:13px;
    color:var(--texto-suave);
    line-height:1.4;
    margin:0 0 20px;
  }
  .botones-sino{
    display:flex;
    gap:12px;
  }
  .btn-sino{
    flex:1;
    padding:16px;
    border-radius:14px;
    border:2px solid var(--hueso-suave);
    background:var(--hueso);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:all .15s;
    color:var(--texto);
  }
  .btn-sino.si:hover, .btn-sino.si.elegido{
    background:var(--verde-claro);
    border-color:var(--verde-claro);
    color:#fff;
  }
  .btn-sino.no:hover, .btn-sino.no.elegido{
    background:var(--rojo);
    border-color:var(--rojo);
    color:#fff;
  }

  .campo-extra{
    margin-top:16px;
  }
  .campo-extra label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--verde-oscuro);
    margin-bottom:6px;
  }
  .campo-extra input, .campo-extra textarea{
    width:100%;
    border:1px solid #dcd3c2;
    border-radius:10px;
    padding:11px;
    font-family:inherit;
    font-size:14px;
    background:var(--hueso);
    resize:vertical;
  }
  .campo-extra input.monto-grande{
    font-size:22px;
    font-weight:700;
    color:var(--verde-oscuro);
    padding:16px;
  }
  .campo-extra textarea{min-height:70px;}
  .campo-extra + .campo-extra{margin-top:12px;}

  .btn-continuar{
    margin-top:16px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--verde-oscuro);
    color:var(--hueso);
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-continuar:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .btn-finalizar{
    background:#1f9e56;
  }

  /* Recorrido completo */
  .completo-card{
    text-align:center;
    background:linear-gradient(160deg,var(--verde-oscuro),var(--verde-medio));
    color:var(--hueso);
  }
  .completo-card .num{
    font-size:40px;
    font-weight:800;
    color:var(--dorado);
    margin:6px 0;
  }
  .completo-card .capital-linea{
    font-size:15px;
    margin-top:6px;
    opacity:0.95;
  }
  .btn-rehacer{
    margin-top:14px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.3);
    color:var(--hueso);
    padding:10px 16px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
  }

  /* Video del día */
  .video h2{
    margin:0 0 4px;
    font-size:16px;
    color:var(--verde-oscuro);
  }
  .video p.ayuda{
    font-size:12px;
    color:var(--texto-suave);
    margin:0 0 14px;
  }
  .video-guardado-msg{
    background:var(--hueso);
    border-radius:10px;
    padding:14px;
    font-size:13px;
    color:var(--verde-oscuro);
    text-align:center;
    font-weight:600;
  }
  .btn-guardar-video{
    margin-top:14px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    background:#1f9e56;
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .video-sino{
    display:flex;
    gap:10px;
    margin-top:4px;
  }
  .video-sino button{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1px solid #dcd3c2;
    background:var(--hueso);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .video-sino button.activo.si{background:var(--verde-claro);color:#fff;border-color:var(--verde-claro);}
  .video-sino button.activo.no{background:var(--rojo);color:#fff;border-color:var(--rojo);}

  /* Historial */
  .historial h2{
    margin:0 0 4px;
    font-size:16px;
    color:var(--verde-oscuro);
  }
  .fila-historial{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--hueso-suave);
  }
  .fila-historial:last-child{border-bottom:none;}
  .fila-historial .etiqueta{
    font-size:13px;
    font-weight:700;
    color:var(--texto-suave);
    min-width:70px;
  }
  .fila-historial .puntos{
    display:flex;
    gap:5px;
  }
  .fila-historial .puntos span{
    width:16px;height:16px;
    border-radius:50%;
    background:var(--hueso-suave);
  }
  .fila-historial .puntos span.si{background:var(--verde-claro);}
  .fila-historial .puntos span.no{background:var(--rojo);}
  .sin-historial{
    font-size:13px;
    color:var(--texto-suave);
    text-align:center;
    padding:10px 0;
  }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--texto-suave);
    margin-top:26px;
    padding:0 20px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🦴</div>
  <h1>KPI VENDEDORA</h1>
  <p class="sub">Registro de desempeño diario · Bones</p>
</header>

<main>

  <!-- PROGRESO -->
  <section class="card progreso-card">
    <div class="progreso-titulo">Progreso de hoy</div>
    <div class="progreso-contador" id="progreso-contador">0 / 7 registrados</div>
    <div class="estaciones" id="estaciones"></div>
  </section>

  <!-- PREGUNTA GUIADA -->
  <section class="card pregunta-card" id="pregunta-card"></section>

  <!-- VIDEO DEL DÍA -->
  <section class="card video" id="video-card">
    <h2>🎥 Video del día</h2>
    <p class="ayuda">Se completa una sola vez por día.</p>
    <div id="video-contenido"></div>
  </section>

  <!-- HISTORIAL -->
  <section class="card historial">
    <h2>📅 Mi progreso</h2>
    <div id="lista-historial"></div>
  </section>

</main>

<footer>
  Bones · Tienda de mascotas · "Cada cliente es una puerta que se nos abre o se cierra en el mercado"
</footer>

<script>
  /* ===================== CONFIG DE PASOS ===================== */
  const PASOS = [
    {
      id: "local",
      nombre: "Local",
      emoji: "🏪",
      texto: "¿El local está preparado para recibir al cliente?",
      desc: "Vidriera limpia · piso limpio · productos ordenados y atractivos · cartelería visible.",
      tipo: "simple"
    },
    {
      id: "postura",
      nombre: "Postura",
      emoji: "🧍",
      texto: "¿Mantuve una postura corporal abierta?",
      desc: "Miré a los ojos · hombros abiertos · manos relajadas y visibles · no me cerré corporalmente.",
      tipo: "simple"
    },
    {
      id: "sonrisa",
      nombre: "Sonrisa",
      emoji: "😊",
      texto: "¿Mantuve la sonrisa durante toda la interacción?",
      desc: "La sonrisa no solamente al comenzar: debe mantenerse durante todo el contacto con el cliente.",
      tipo: "simple"
    },
    {
      id: "mascota",
      nombre: "Mascota",
      emoji: "🐶",
      texto: "¿Relacioné el producto con la mascota del cliente?",
      desc: "Busqué conocer a la mascota y relacioné el producto con sus características, necesidades o rutina.",
      tipo: "evidencia",
      camposSi: [
        {id:"nombreMascota", label:"¿Cuál es el nombre de la mascota?", tag:"input"},
        {id:"relacion", label:"¿Cómo relacionaste el producto con la mascota y el cliente", tag:"textarea"}
      ]
    },
    {
      id: "floreo",
      nombre: "Floreo",
      emoji: "💬",
      texto: "¿Utilicé floreo verbal para generar cercanía?",
      desc: "Hice preguntas sobre la mascota · saqué temas de conversación · mostré interés en la personay mascota.",
      tipo: "evidencia",
      camposSi: [
        {id:"comoFloreo", label:"¿Cómo utilizaste el floreo verbal?", tag:"textarea"}
      ]
    },
    {
      id: "venta",
      nombre: "Venta",
      emoji: "🛒",
      texto: "¿Realicé una venta cruzada específica?",
      desc: "No pregunté solamente \u201c¿necesitás algo más?\u201d. Ofrecí un producto complementario relacionado con la compra.",
      tipo: "evidencia",
      camposSi: [
        {id:"queOfreci", label:"¿Qué ofreciste y por qué era complementario?", tag:"textarea"}
      ]
    },
    {
      id: "capital",
      nombre: "Capital",
      emoji: "💵",
      texto: "¿Cuánto dinero obtuviste en esta venta?",
      desc: "Cargá el capital obtenido para cerrar el registro de esta interacción.",
      tipo: "capital"
    }
  ];

  const hoyStr = () => new Date().toISOString().slice(0,10);
  const horaAhora = () => new Date().toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});

  /* ===================== ESTADO ===================== */
  function estadoVacio(){
    return {
      fecha: hoyStr(),
      pasoActual: 0,
      respuestas: {},
      interaccionesHoy: [],
      video: { hecho:null, titulo:"", interrupcion:"", retencion:"", cta:"", motivoNoHecho:"", publicadoInstagram:null, ultimoEnvioHora:null }
    };
  }

  function cargarEstado(){
    const guardado = localStorage.getItem('bones_hoy');
    if(guardado){
      const obj = JSON.parse(guardado);
      if(obj.fecha === hoyStr()) return obj;
    }
    return estadoVacio();
  }

  let estado = cargarEstado();

  function guardarEstado(){
    localStorage.setItem('bones_hoy', JSON.stringify(estado));
  }

  function guardarInteraccionEnHistorial(){
    // Guarda esta venta puntual como una fila nueva del historial (no pisa las anteriores)
    const lista = JSON.parse(localStorage.getItem('bones_interacciones') || "[]");
    lista.push({
      fecha: estado.fecha,
      hora: horaAhora(),
      respuestas: JSON.parse(JSON.stringify(estado.respuestas))
    });
    localStorage.setItem('bones_interacciones', JSON.stringify(lista));
  }

  function guardarVideoEnHistorial(){
    const lista = JSON.parse(localStorage.getItem('bones_videos') || "[]");
    lista.push({
      fecha: estado.fecha,
      hora: estado.video.ultimoEnvioHora || horaAhora(),
      hecho: estado.video.hecho,
      titulo: estado.video.titulo,
      publicadoInstagram: estado.video.publicadoInstagram
    });
    localStorage.setItem('bones_videos', JSON.stringify(lista));
  }

  /* ===================== PROGRESO / ESTACIONES ===================== */
  function renderEstaciones(){
    const cont = document.getElementById('estaciones');
    cont.innerHTML = "";
    PASOS.forEach((p, i) => {
      const r = estado.respuestas[p.id];
      let claseP = '';
      let simbolo = '';
      if(r){
        if(p.tipo === 'capital'){ claseP = 'si'; simbolo = '✓'; }
        else { claseP = (r.resp === 'si' ? 'si' : 'no'); simbolo = (r.resp === 'si' ? '✓' : '✕'); }
      }
      const est = document.createElement('div');
      est.className = 'estacion';
      est.innerHTML = `
        <div class="punto ${claseP}">${simbolo}</div>
        <div class="estacion-nombre">${p.nombre}</div>
        <div class="estacion-hora">${r && r.hora ? r.hora : ''}</div>
      `;
      cont.appendChild(est);
      if(i < PASOS.length - 1){
        const linea = document.createElement('div');
        linea.className = 'linea-conexion';
        cont.appendChild(linea);
      }
    });
    const completados = Object.keys(estado.respuestas).length;
    document.getElementById('progreso-contador').textContent = `${completados} / ${PASOS.length} registrados`;
  }

  /* ===================== PREGUNTA GUIADA ===================== */
  function renderPregunta(){
    const cont = document.getElementById('pregunta-card');

    if(estado.pasoActual >= PASOS.length){
      const siCount = Object.values(estado.respuestas).filter(r => r.resp === 'si').length;
      const capital = estado.respuestas['capital'] ? estado.respuestas['capital'].monto : 0;
      cont.className = 'card completo-card';
      cont.innerHTML = `
        <div style="font-size:13px;letter-spacing:1px;text-transform:uppercase;opacity:0.85;">Interacción enviada al entrenador</div>
        <div class="num">${siCount} de 6</div>
        <div style="font-size:13px;opacity:0.9;">conductas cumplidas</div>
        <div class="capital-linea">💵 Capital obtenido: $${capital.toLocaleString('es-AR')}</div>
        <button class="btn-rehacer" onclick="rehacerRecorrido()">Registrar otra interacción</button>
      `;
      return;
    }

    const p = PASOS[estado.pasoActual];
    const yaRespondido = estado.respuestas[p.id];

    cont.className = 'card pregunta-card';

    if(p.tipo === 'capital'){
      const montoActual = yaRespondido ? yaRespondido.monto : "";
      cont.innerHTML = `
        <div class="pregunta-emoji">${p.emoji}</div>
        <p class="pregunta-texto">${p.texto}</p>
        <p class="pregunta-desc">${p.desc}</p>
        <div class="campo-extra">
          <label>Capital obtenido</label>
          <input type="number" min="0" class="monto-grande" id="campo-capital" placeholder="$ 0" value="${montoActual}">
        </div>
        <button class="btn-continuar btn-finalizar" onclick="finalizarCapital()">Finalizar y enviar al entrenador</button>
      `;
      return;
    }

    let html = `
      <div class="pregunta-emoji">${p.emoji}</div>
      <p class="pregunta-texto">${p.texto}</p>
      <p class="pregunta-desc">${p.desc}</p>
      <div class="botones-sino">
        <button class="btn-sino si ${yaRespondido && yaRespondido.resp==='si' ? 'elegido':''}" onclick="elegirRespuesta('${p.id}','si')">SÍ</button>
        <button class="btn-sino no ${yaRespondido && yaRespondido.resp==='no' ? 'elegido':''}" onclick="elegirRespuesta('${p.id}','no')">NO</button>
      </div>
      <div id="campos-extra"></div>
    `;
    cont.innerHTML = html;

    if(yaRespondido){
      mostrarCamposExtra(p, yaRespondido.resp);
    }
  }

  function elegirRespuesta(pasoId, resp){
    if(!estado.respuestas[pasoId]) estado.respuestas[pasoId] = {};
    estado.respuestas[pasoId].resp = resp;
    guardarEstado();
    renderEstaciones();
    renderPregunta();
  }

  function idsCamposRequeridos(p, resp){
    if(resp === 'no') return ['campo-mejora'];
    if(resp === 'si' && p.tipo === 'evidencia' && p.camposSi) return p.camposSi.map(c => `campo-${c.id}`);
    return [];
  }

  function camposCompletos(p, resp){
    return idsCamposRequeridos(p, resp).every(id => {
      const el = document.getElementById(id);
      return el && el.value.trim().length > 0;
    });
  }

  function actualizarBotonContinuar(p, resp){
    const btn = document.getElementById('btn-continuar-el');
    if(btn) btn.disabled = !camposCompletos(p, resp);
  }

  function mostrarCamposExtra(p, resp){
    const cont = document.getElementById('campos-extra');
    const r = estado.respuestas[p.id];
    let html = "";

    if(resp === 'no'){
      html += `
        <div class="campo-extra">
          <label>Oportunidad de mejora *</label>
          <textarea id="campo-mejora" placeholder="¿Qué podrías mejorar acá?" oninput="actualizarBotonContinuar(PASOS.find(x=>x.id==='${p.id}'),'no')">${r.mejora || ""}</textarea>
        </div>
      `;
    } else if(p.tipo === 'evidencia' && p.camposSi){
      p.camposSi.forEach(c => {
        html += `
          <div class="campo-extra">
            <label>${c.label} *</label>
            ${c.tag === 'input'
              ? `<input type="text" id="campo-${c.id}" value="${r[c.id] || ""}" oninput="actualizarBotonContinuar(PASOS.find(x=>x.id==='${p.id}'),'si')">`
              : `<textarea id="campo-${c.id}" oninput="actualizarBotonContinuar(PASOS.find(x=>x.id==='${p.id}'),'si')">${r[c.id] || ""}</textarea>`}
          </div>
        `;
      });
    }

    html += `<button class="btn-continuar" id="btn-continuar-el" onclick="continuarPaso('${p.id}')">Continuar →</button>`;
    cont.innerHTML = html;
    actualizarBotonContinuar(p, resp);
  }

  function continuarPaso(pasoId){
    const p = PASOS.find(x => x.id === pasoId);
    const r = estado.respuestas[pasoId];

    if(!camposCompletos(p, r.resp)){
      actualizarBotonContinuar(p, r.resp);
      return; // faltan campos obligatorios, no avanza
    }

    r.hora = horaAhora();

    if(r.resp === 'no'){
      r.mejora = document.getElementById('campo-mejora').value.trim();
    } else if(p.tipo === 'evidencia' && p.camposSi){
      p.camposSi.forEach(c => {
        const el = document.getElementById(`campo-${c.id}`);
        r[c.id] = el.value.trim();
      });
    }

    estado.pasoActual++;
    guardarEstado();
    renderEstaciones();
    renderPregunta();
  }

  function finalizarCapital(){
    const monto = parseFloat(document.getElementById('campo-capital').value) || 0;
    estado.respuestas['capital'] = { monto, hora: horaAhora() };
    estado.pasoActual++;
    guardarEstado();
    guardarInteraccionEnHistorial();
    renderEstaciones();
    enviarAlEntrenador();
    renderPregunta();
    renderHistorial();
  }

  function rehacerRecorrido(){
    estado.pasoActual = 0;
    estado.respuestas = {};
    guardarEstado();
    renderEstaciones();
    renderPregunta();
  }

  /* ===================== VIDEO DEL DÍA ===================== */
  function leerCamposVideoDelDOM(){
    // Guarda lo que la vendedora ya escribió antes de volver a dibujar la sección,
    // así elegir Sí/No nunca borra lo tipeado.
    const tCampo = document.getElementById('v-titulo');
    const iCampo = document.getElementById('v-interrupcion');
    const rCampo = document.getElementById('v-retencion');
    const cCampo = document.getElementById('v-cta');
    const motivoCampo = document.getElementById('v-motivo');
    if(tCampo) estado.video.titulo = tCampo.value;
    if(iCampo) estado.video.interrupcion = iCampo.value;
    if(rCampo) estado.video.retencion = rCampo.value;
    if(cCampo) estado.video.cta = cCampo.value;
    if(motivoCampo) estado.video.motivoNoHecho = motivoCampo.value;
  }

  function renderVideo(){
    const cont = document.getElementById('video-contenido');
    const v = estado.video;

    let extraSegunRespuesta = "";
    if(v.hecho === 'no'){
      extraSegunRespuesta = `
        <div class="campo-extra">
          <label>¿Por qué no se hizo hoy?</label>
          <textarea id="v-motivo" placeholder="Contá brevemente el motivo...">${v.motivoNoHecho || ""}</textarea>
        </div>
      `;
    } else if(v.hecho === 'si'){
      extraSegunRespuesta = `
        <div class="campo-extra">
          <label>📲 ¿Se publicó en Instagram?</label>
          <div class="video-sino">
            <button class="si ${v.publicadoInstagram==='si'?'activo si':''}" onclick="marcarPublicadoInstagram('si')">SÍ</button>
            <button class="no ${v.publicadoInstagram==='no'?'activo no':''}" onclick="marcarPublicadoInstagram('no')">NO</button>
          </div>
        </div>
      `;
    }

    const ultimoEnvio = v.ultimoEnvioHora
      ? `<div class="video-guardado-msg" style="margin-bottom:14px;">✅ Último envío al entrenador hoy: ${v.ultimoEnvioHora}</div>`
      : "";

    cont.innerHTML = `
      ${ultimoEnvio}
      <div class="campo-extra">
        <label>Título del video</label>
        <input type="text" id="v-titulo" value="${v.titulo}" placeholder="Ej: Cómo elegir el alimento correcto">
      </div>
      <div class="campo-extra">
        <label>⚡ Patrón de interrupción — ¿Qué hiciste al comienzo para captar la atención?</label>
        <textarea id="v-interrupcion">${v.interrupcion}</textarea>
      </div>
      <div class="campo-extra">
        <label>👀 Patrón de retención — ¿Cómo generaste interés y deseo durante el video?</label>
        <textarea id="v-retencion">${v.retencion}</textarea>
      </div>
      <div class="campo-extra">
        <label>👉 Call to action — ¿Qué acción le pediste a quien lo vea?</label>
        <textarea id="v-cta">${v.cta}</textarea>
      </div>
      <div class="campo-extra">
        <label>🎬 ¿Hice el video del día? (se completa una vez por día)</label>
        <div class="video-sino">
          <button class="si ${v.hecho==='si'?'activo si':''}" onclick="marcarVideoHecho('si')">SÍ</button>
          <button class="no ${v.hecho==='no'?'activo no':''}" onclick="marcarVideoHecho('no')">NO</button>
        </div>
      </div>
      ${extraSegunRespuesta}
      <button class="btn-guardar-video" onclick="enviarVideoAlEntrenador()">Enviar al entrenador</button>
    `;
  }

  function marcarVideoHecho(valor){
    leerCamposVideoDelDOM();
    estado.video.hecho = valor;
    guardarEstado();
    renderVideo();
  }

  function marcarPublicadoInstagram(valor){
    leerCamposVideoDelDOM();
    estado.video.publicadoInstagram = valor;
    guardarEstado();
    renderVideo();
  }

  function enviarVideoAlEntrenador(){
    const v = estado.video;
    if(!v.hecho){
      alert("Marcá si hiciste el video o no antes de enviar.");
      return;
    }
    leerCamposVideoDelDOM();
    v.ultimoEnvioHora = horaAhora();
    guardarEstado();
    guardarVideoEnHistorial();
    renderHistorial();

    let msg = `🐾 *BONES – Video del día*\n\n`;
    msg += `🎬 ¿Hizo el video hoy? ${v.hecho === 'si' ? 'Sí' : 'No'}\n`;
    if(v.hecho === 'si'){
      msg += `Título: ${v.titulo || "(sin título)"}\n`;
      msg += `⚡ Patrón de interrupción: ${v.interrupcion || "(sin completar)"}\n`;
      msg += `👀 Patrón de retención: ${v.retencion || "(sin completar)"}\n`;
      msg += `👉 Call to action: ${v.cta || "(sin completar)"}\n`;
      msg += `📲 ¿Se publicó en Instagram? ${v.publicadoInstagram === 'si' ? 'Sí' : (v.publicadoInstagram === 'no' ? 'No' : '(sin marcar)')}\n`;
    } else {
      msg += `Motivo: ${v.motivoNoHecho || "(sin completar)"}\n`;
    }

    const numero = "5493704097249";
    const url = `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');

    renderVideo();
  }

  /* ===================== HISTORIAL ===================== */
  function renderHistorial(){
    const cont = document.getElementById('lista-historial');
    const interacciones = JSON.parse(localStorage.getItem('bones_interacciones') || "[]");
    const videos = JSON.parse(localStorage.getItem('bones_videos') || "[]");

    // Unimos ventas y videos en una sola lista, ordenados del más reciente al más viejo
    const items = [
      ...interacciones.map(x => ({...x, esVideo:false})),
      ...videos.map(x => ({...x, esVideo:true}))
    ].sort((a,b) => (b.fecha+b.hora).localeCompare(a.fecha+a.hora)).slice(0, 30);

    if(items.length === 0){
      cont.innerHTML = `<div class="sin-historial">Todavía no hay ventas ni videos registrados.</div>`;
      return;
    }

    const hoy = hoyStr();
    const ayer = new Date(Date.now() - 86400000).toISOString().slice(0,10);

    cont.innerHTML = "";
    items.forEach(item => {
      const etiquetaFecha = item.fecha === hoy ? "Hoy" : (item.fecha === ayer ? "Ayer" : item.fecha.slice(5).split('-').reverse().join('/'));
      const fila = document.createElement('div');
      fila.className = 'fila-historial';

      if(item.esVideo){
        const instagramTxt = item.hecho === 'si' ? (item.publicadoInstagram === 'si' ? ' · 📲 IG ✅' : (item.publicadoInstagram === 'no' ? ' · 📲 IG ❌' : '')) : '';
        fila.innerHTML = `<span class="etiqueta">🎥 ${etiquetaFecha} · ${item.hora}</span><span class="puntos">${item.hecho === 'si' ? '✅ Video hecho'+instagramTxt : '❌ No se hizo'}</span>`;
      } else {
        let puntosHtml = "";
        PASOS.forEach(p => {
          const r = item.respuestas[p.id];
          let clase = '';
          if(r){ clase = p.tipo === 'capital' ? 'si' : (r.resp === 'si' ? 'si' : 'no'); }
          puntosHtml += `<span class="${clase}"></span>`;
        });
        const capital = item.respuestas['capital'] ? item.respuestas['capital'].monto : 0;
        fila.innerHTML = `<span class="etiqueta">💰 ${etiquetaFecha} · ${item.hora}<br><span style="font-size:11px;color:var(--dorado);font-weight:700;">$${capital.toLocaleString('es-AR')}</span></span><span class="puntos">${puntosHtml}</span>`;
      }
      cont.appendChild(fila);
    });
  }

  /* ===================== ENVIAR RECORRIDO AL ENTRENADOR ===================== */
  function enviarAlEntrenador(){
    const siCount = Object.values(estado.respuestas).filter(r => r.resp === 'si').length;
    const capital = estado.respuestas['capital'] ? estado.respuestas['capital'].monto : 0;

    let msg = `🐾 *BONES – KPI Vendedora*\n\n`;
    msg += `*Conductas cumplidas: ${siCount} / 6*\n`;
    PASOS.filter(p => p.tipo !== 'capital').forEach(p => {
      const r = estado.respuestas[p.id];
      if(!r){ msg += `${p.nombre}: (sin registrar)\n`; return; }
      msg += `${p.nombre} (${r.hora || ""}): ${r.resp === 'si' ? '✅' : '❌'}`;
      if(r.resp === 'no' && r.mejora) msg += ` — Mejora: ${r.mejora}`;
      msg += `\n`;
    });
    msg += `\n💵 *Capital obtenido en esta venta: $${capital.toLocaleString('es-AR')}*\n`;

    const URL_PLANILLA = "https://script.google.com/macros/s/AKfycbz2_LaVWz3xA54rIXSM9AY1Fnya44-15DaiAQW9RzPVBVaCqcJGaqCo_HzjbuTl41cy/exec";
    fetch(URL_PLANILLA, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({
        tipo: "kpi_vendedora",
        fecha: estado.fecha,
        siCount, capital,
        respuestas: estado.respuestas
      })
    });

    const numero = "5493704097249";
    const url = `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }

  /* ===================== INICIO ===================== */
  renderEstaciones();
  renderPregunta();
  renderVideo();
  renderHistorial();
</script>

</body>
</html>
